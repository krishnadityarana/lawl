<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universe Simulation</title>
<style>
body {
  margin:0;
  overflow:hidden;
  background:black;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

.stars {
  position:absolute;
  width:100%;
  height:100%;
  overflow:hidden;
}

.star {
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  animation: twinkle 3s infinite;
}

@keyframes twinkle {
  0%,100% {opacity:0.2;}
  50% {opacity:1;}
}

.content {
  z-index:2;
  padding:20px;
  animation:fadeIn 3s;
}

h1 {
  font-size:3rem;
  color:#ffb6ff;
}

p {
  font-size:1.2rem;
  line-height:1.8;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</html>
